function header(){return `<header class="site-header"><a class="brand" href="#" data-action="home" aria-label="AI Flower home">${mark}<span>AI Flower</span></a><nav class="header-links" aria-label="Main navigation"><button class="text-link" data-action="method">How it works</button><a class="text-link" href="scoring.html" target="_blank" rel="noopener">Scoring explained ↗</a></nav></header>`;}
function footer(){return `<footer class="footer"><p>Your responses stay in this tab.</p><div class="footer-links"><a href="edit-questions.html" target="_blank" rel="noopener">All questions / edit ↗</a><a href="offline.html" download="my-ai-flower.html">Offline copy ↓</a><a href="scoring.html" target="_blank" rel="noopener">Scoring & research ↗</a><a href="https://bambamramfan.github.io/ai-compass/" target="_blank" rel="noreferrer">Inspired by the original ↗</a></div></footer>`;}
function method(){return `<dialog id="method-dialog" class="method-dialog" aria-labelledby="method-title"><div class="dialog-head"><h2 id="method-title">Reading your flower.</h2><button class="dialog-close" aria-label="Close explanation" data-action="close-method">×</button></div><p>Each petal is one of seven issues with matching benefit and harm statements. The shape keeps those two answers separate in the readout.</p><ol><li><strong>Colour: green to red.</strong> The difference between your benefit and harm ratings sets the colour. Green leans towards benefits; red towards harm; yellow means equal ratings. Equal ratings can mean both or neither.</li><li><strong>Petal length: how much you agree.</strong> The more strongly you agree with either statement, the farther the petal reaches. When neither is endorsed it remains a short, smooth petal. Grey marks an incomplete pair.</li><li><strong>Texture: your both/and.</strong> Agreeing with both makes a petal more jagged and gives it more relief. Strong agreement with both makes it rougher still. The texture shows agreement with both views, not how torn you feel.</li><li><strong>Your feelings stay separate.</strong> The final reflections still show whether you feel mixed, torn or undecided. These answers describe your feelings; the petals describe your views on each issue.</li></ol><p>The stem is decorative. The relief slider is visual exaggeration only. Shape, volume and colour are not total scores, probabilities or population rankings.</p><p>Nothing is collected on this form. Your answers stay in this tab; refreshing clears them.</p><a class="button-primary" href="scoring.html" target="_blank" rel="noopener">How the scores and petals work ↗</a></dialog>`;}

function cardDialog(){return `<dialog id="flower-card-dialog" class="flower-card-dialog" aria-labelledby="card-title"><div class="dialog-head"><h2 id="card-title">Your flower, to keep.</h2><button class="dialog-close" aria-label="Close flower card" data-action="close-card">×</button></div><p class="card-status" role="status">Growing your card…</p><img id="flower-card-preview" alt="" hidden><div class="card-downloads" hidden><button class="button-primary" data-action="download-card-png">Download PNG ↓</button><button class="button-secondary" data-action="download-card-svg">Download SVG ↓</button></div><p class="small-note">Made in your browser. Nothing is uploaded. The SVG keeps the text crisp around an image of your 3D flower.</p></dialog>`;}
function openFlowerCard(){
 const dialog=document.getElementById('flower-card-dialog');if(!dialog)return;
 scene?.setSpin(false);state.spin=false;const rotate=document.querySelector('[data-action="spin"]');if(rotate)rotate.textContent='Rotate';
 dialog.showModal();
 if(flowerCard)return;
 const answers={...state.answers},example=state.example;
 requestAnimationFrame(()=>{if(!dialog.isConnected)return;try{
  const responseCount=items.filter(i=>known(answers[i.id])||['yes','no'].includes(answers[i.id])).length;
  flowerCard=renderFlowerCard(calculate(answers),{example,responseCount});
  const image=document.getElementById('flower-card-preview');image.src=flowerCard.png;image.alt=flowerCard.portrait.title+'. '+flowerCard.portrait.summary;image.hidden=false;
  dialog.querySelector('.card-status').textContent=example?'An example flower card—not your answers.':'Your flower and a few words about where you stand.';
  dialog.querySelector('.card-downloads').hidden=false;
 }catch(error){dialog.querySelector('.card-status').textContent='This browser couldn’t make the card. Try Print your profile, or open the quiz in another browser.';}});
}
function sampleAnswers(){const a={};PAIRS.forEach((p,i)=>{a[p+'-B']=[4,1,4,4,3,4,0][i];a[p+'-H']=[1,4,4,0,4,3,4][i];});return a;}
function stage(){return `<div class="snowflake-stage"><canvas id="snowflake-canvas" tabindex="0" role="img" aria-label="Interactive three-dimensional AI flower. Each petal is an issue. Green petals gently rise and red petals droop. Texture shows both/and. Drag to turn, use arrow keys to rotate, plus or minus to zoom, Home to reset."></canvas><svg class="petal-leaders" aria-hidden="true">${ISSUES.map(i=>`<path data-leader="${i.id}"/>`).join('')}</svg><div class="snowflake-tip-labels" role="group" aria-label="Choose a flower petal">${ISSUES.map(i=>`<button class="petal-label" data-tip="${i.id}" data-action="issue" data-issue="${i.id}" aria-pressed="${i.id===state.issue}">${esc(i.name)}</button>`).join('')}</div><span class="stage-hint">Drag to turn · Scroll to zoom</span></div>`;}

function introArt(){return `<div class="intro-art snowflake-intro"><div class="art-label">Your views, in bloom · 3D</div>${stage()}<div class="snowflake-ramp"><span>Benefit-leaning</span><i aria-hidden="true"></i><span>Harm-leaning</span></div><div class="art-caption"><p>Every petal has a point of view.</p><span>Illustrative profile</span></div></div>`;}

function intro(){return `<main id="main"><section class="intro"><div><div class="eyebrow">15 topics · Your actual views on AI</div><h1>Find out what<br>type of <em>AI flower</em><br>you are</h1><p class="lead">You can love the tool and distrust the company. You can think the hype is ridiculous and still expect the technology to change everything.</p><p>Rate each view on its own. Agree with both if both fit. Disagree with both if neither does. You don't have to split the difference.</p><div class="intro-actions"><button class="button-primary" data-action="start">${countChosen()?'Continue growing your flower':'Find my flower'} <span aria-hidden="true">→</span></button><button class="text-link" data-action="example">See an example result ↗</button></div><p class="small-note">Nothing is collected on this form</p></div>${introArt()}</section></main>`;}

function topicNav(){return `<aside class="topic-nav" aria-label="Topics"><p class="nav-title">The questions</p>${cards.map((c,i)=>`<button class="topic-button ${i===state.index?'active':''} ${c.items.every(item=>isChosen(item.id))?'done':''}" data-action="topic" data-index="${i}" ${i===state.index?'aria-current="step"':''}><span class="nav-index">${c.items.every(item=>isChosen(item.id))?'✓':i<15?String(i+1).padStart(2,'0'):'◇'}</span>${esc(c.title)}</button>`).join('')}<div class="nav-bottom"><button class="text-link" data-action="results">View results so far →</button></div></aside>`;}
function rating(item,index){const value=state.answers[item.id],opts=values(item.kind);return `<fieldset class="rating-card"><legend><span class="statement-number">${item.kind==='reflection'?'Reflection':'Statement'} ${index+1}</span>${esc(item.text)}</legend><div class="rating-grid ${item.kind==='yesno'?'two-options':''}">${labels[item.kind].map((label,i)=>`<label class="rating-option"><input type="radio" id="${item.id}-${i}" name="${item.id}" data-item="${item.id}" data-value="${esc(opts[i])}" ${value===opts[i]?'checked':''}><span>${item.kind==='agreement'?`<span class="number" aria-hidden="true">${i+1}</span>`:''}${esc(label)}</span></label>`).join('')}</div><div class="choice-utilities">${['skip'].map(v=>`<label class="small-choice"><input type="radio" id="${item.id}-${v}" name="${item.id}" data-item="${item.id}" data-value="${v}" ${['unsure','skip'].includes(value)?'checked':''}>Not sure / skip</label>`).join('')}${isChosen(item.id)?`<button class="clear-answer" type="button" data-action="clear" data-item="${item.id}">Clear</button>`:''}</div></fieldset>`;}
function quiz(){const c=cards[state.index],pair=PAIRS.find(p=>c.items.some(i=>i.id===p+'-B')),both=pair&&state.answers[pair+'-B']>=3&&state.answers[pair+'-H']>=3;return `<main id="main" class="quiz-layout">${topicNav()}<section class="quiz-main" aria-labelledby="question-title"><div class="mobile-topic"><label class="visually-hidden" for="topic-select">Choose a topic</label><select id="topic-select">${cards.map((c,i)=>`<option value="${i}" ${state.index===i?'selected':''}>${i<15?String(i+1).padStart(2,'0'):'◇'} · ${esc(c.title)}</option>`).join('')}</select></div><div class="question-topline"><span class="eyebrow">${esc(c.title)}</span><span class="question-count">${state.index<15?`${state.index+1} / 15`:'Final reflection'}</span></div><div class="progress-track" role="progressbar" aria-label="Responses chosen" aria-valuemin="0" aria-valuemax="34" aria-valuenow="${countChosen()}"><div class="progress-fill" style="width:${countChosen()/34*100}%"></div></div><div class="question-heading"><h1 id="question-title" tabindex="-1">${esc(c.prompt)}</h1></div>${c.items.map(rating).join('')}${both?`<p class="inline-both">${check} You've agreed with both views here.</p>`:''}<div class="quiz-footer"><button class="text-link" data-action="back">← ${state.index?'Back':'Introduction'}</button><button class="button-primary" data-action="next">${state.index===15?'See your flower':'Continue'} <span aria-hidden="true">→</span></button></div><p class="quiz-footnote">${countChosen()} of 34 choices made · Unanswered statements stay unscored.<br>Your responses stay in this tab. Refreshing clears them.</p></section></main>`;}

function meter(score,kind){return `<div class="meter ${kind}" aria-hidden="true"><span style="width:${score??0}%"></span></div>`;}
function scoreRow(name,info,kind){const anchor=info.score===null?'Need at least 4 of 7 answers':info.score>=88?'Strong agreement overall':info.score>=63?'Agreement overall':info.score>=38?'Around neutral overall':info.score>=13?'Disagreement overall':'Strong disagreement overall';return `<div class="score-row"><div><div class="score-name">${name}</div><div class="score-meta">${info.count}/7 answered · ${anchor}</div></div><div class="score" style="color:var(--${kind==='benefit'?'teal':'coral'})">${info.score??'—'}${info.score!==null?'<small> /100</small>':''}</div></div>${meter(info.score,kind)}`;}
function summaryCard(r){return `<section class="summary-card" aria-labelledby="expectations-title"><h2 id="expectations-title">Your expectations</h2>${scoreRow('Benefits you see',r.benefits,'benefit')}${scoreRow('Harm you see',r.harms,'harm')}<p class="chart-caption">Agreement with the selected statements. 50 means neutral on average, not a 50% chance.</p><div class="score-divider"></div><div class="score-row" style="margin-top:0"><div><div class="score-name">The scale of change</div><div class="score-meta">${r.changeScore===null?'All three settings needed':'Average across three settings'}</div></div><div class="score" style="color:var(--yellow)">${r.changeScore??'—'}${r.changeScore!==null?'<small> /100</small>':''}</div></div>${meter(r.changeScore,'change')}${r.changes.map((c,i)=>`<div class="change-item"><span>${['Your learning, teaching or work','Education','Society'][i]}</span><strong>${known(c.value)?labels.change[c.value]:['unsure','skip'].includes(c.value)?'Not sure / skip':'Not answered'}</strong></div>`).join('')}</section>`;}
function stretchCard(r){const visible=r.stretch.score!==null,both=r.pairs.filter(p=>p.kind==='both');return `<section class="stretch-card" aria-labelledby="stretch-title"><div class="eyebrow">Stretch · Your both/and</div><h2 id="stretch-title" class="visually-hidden">Holding benefits and harms together</h2><div class="stretch-value">${visible?r.stretch.both:'—'} <small>${visible?`of ${r.stretch.complete} comparable topics`:'More complete pairs needed'}</small></div><p>${visible?'You agreed with both the benefit and the harm statement in these topics. That doesn’t automatically mean you feel torn.':`You've completed ${r.stretch.complete} of 7 pairs. At least 4 complete pairs are needed for an overall count.`}</p>${both.length?`<div class="topic-chips">${both.map(p=>`<span class="topic-chip">${esc(topicName(p.id))}</span>`).join('')}</div>`:visible?'<p style="margin-top:12px">No complete topic pair had agreement with both statements. The breakdown below shows the views you did endorse.</p>':''}</section>`;}
function reflectionCard(r){return `<section class="reflection-card" aria-labelledby="reflection-title"><h2 id="reflection-title">How it feels</h2><p class="reflection-intro">Seeing both sides and feeling torn are different things. Here's what you said.</p>${r.feelings.map((f,i)=>`<div class="feeling-row"><div><strong>${['Mixed feelings','Inner conflict','Difficulty deciding'][i]}</strong><div class="dots" aria-hidden="true">${[1,2,3,4].map(v=>`<span class="dot ${known(f.value)&&f.value>=v?'on':''}"></span>`).join('')}</div></div><span class="feeling-label">${known(f.value)?labels.reflection[f.value]:['unsure','skip'].includes(f.value)?'Not sure / skip':'Not answered'}</span></div>`).join('')}</section>`;}
function narrative(r){const b=r.benefits.score,h=r.harms.score;if(b===null||h===null)return {title:'A few views. Room for more.',text:'There aren’t enough scored answers for a full picture yet. You can still explore every answer below, or go back and fill in a few more.'};let title;if(b>=75&&h>=75)title='You can see the promise and the damage.';else if(b>=75&&h<50)title='The promise has you more convinced.';else if(h>=75&&b<50)title='The warnings have you more convinced.';else if(b<=25&&h<=25)title='Neither forecast has you convinced.';else if(b===50&&h===50)title='Your averages land near neutral.';else title='There’s more than one side to your view.';let text='This is a snapshot of your answers, with benefits and harms kept separate.';if(r.changeScore>=75)text+=' You expect major change across your life, education and society on average.';else if(r.changeScore!==null&&r.changeScore<=25)text+=' You expect relatively limited change overall.';if(known(state.answers['FEEL-C']))text+=` You report ${['no','a little','some','quite a lot of','a great deal of'][state.answers['FEEL-C']]} inner conflict.`;return{title,text};}
function breakdown(r){return `<section aria-labelledby="breakdown-title"><h2 id="breakdown-title" class="section-title">The answers behind the picture</h2><p class="section-note">Open any topic to see what you chose. Context answers stay visible without quietly moving your scores.</p><div class="breakdown">${cards.map((c,index)=>{const pair=r.pairs.find(p=>c.items.some(i=>i.id===p.id+'-B'));const status=pair?({both:'You see both',benefit:'You see benefit',harm:'You see harm',neither:'Neither view convinced you',incomplete:'Incomplete pair'}[pair.kind]):'Context';return `<details><summary><span class="breakdown-title">${esc(c.title)}<span class="pair-status ${pair?.kind==='both'?'both':''}">${index===15?'Direct reflection':status}</span></span></summary>${c.items.map(item=>`<div class="answer-line"><span>${esc(item.text)}</span><strong>${esc(responseLabel(item,state.answers[item.id]))}</strong></div>`).join('')}<button class="text-link" style="margin-bottom:15px" data-action="topic" data-index="${index}">Review this topic →</button></details>`;}).join('')}</div></section>`;}
function issueControls(r){
 const selected=ISSUES.find(i=>i.id===state.issue),pair=r.pairs.find(p=>p.id===state.issue),signal=issueSignal(pair);
 const card=cards.find(c=>c.items.some(i=>i.id===state.issue+'-B'));
 const b=card.items.find(i=>i.id.endsWith('-B')),h=card.items.find(i=>i.id.endsWith('-H'));
 return `<div class="issue-picker" role="group" aria-label="Explore an issue">${ISSUES.map((issue,i)=>{const signal=issueSignal(r.pairs.find(p=>p.id===issue.id)),rgb=signal.color.map(c=>Math.round(c*255)).join(',');return `<button data-action="issue" data-issue="${issue.id}" aria-pressed="${state.issue===issue.id}"><i style="background:rgb(${rgb})" aria-hidden="true"></i>${esc(issue.name)}</button>`;}).join('')}</div><div class="issue-readout" aria-live="polite"><div class="issue-readout-title"><h3>${esc(selected.name)}</h3><button class="text-link" data-action="topic" data-index="${cards.indexOf(card)}">Review →</button></div><div class="issue-answer"><span>Benefit statement</span><strong>${esc(responseLabel(b,pair.benefit))}</strong></div><div class="issue-answer"><span>Harm statement</span><strong>${esc(responseLabel(h,pair.harm))}</strong></div><div class="issue-answer"><span>Surface texture</span><strong>${!signal.complete?'Incomplete pair':signal.stretch===1?'Strong both/and':signal.stretch===.5?'Some both/and':'Smooth: no dual endorsement'}</strong></div></div>`;
}
function chartPanel(r){
 return `<section class="chart-card snowflake-card" aria-labelledby="chart-title"><div class="chart-header"><h2 id="chart-title">Your AI flower</h2></div>${stage()}<div class="snowflake-ramp"><span>Benefit-leaning</span><i aria-hidden="true"></i><span>Harm-leaning</span></div><p class="chart-caption">One petal per issue. Green → yellow → red shows the balance of your two answers. Jagged depth shows how strongly you agree with both. A short, smooth petal means neither statement was endorsed; grey means the pair is incomplete. Green petals rise a little; red petals gently droop.</p><div class="snowflake-tools"><button class="button-secondary" data-action="spin">${state.spin?'Pause rotation':'Rotate'}</button><button class="text-link" data-action="reset-view">Reset view</button><button class="text-link" data-action="open-card">Save flower card ↓</button><button class="text-link" data-action="save-image">Flower only ↓</button><label class="relief-control" for="snowflake-relief">Visual relief <input id="snowflake-relief" type="range" min="0.35" max="2.2" step="0.05" value="${state.view.relief??1}"><output id="relief-value">×${(state.view.relief??1).toFixed(1)}</output></label></div><p class="chart-caption">Relief changes the drawing, not your answers. These textures show both/and, not a diagnosis of feeling conflicted.</p>${issueControls(r)}</section>`;
}
function results(){
 const r=calculate(state.answers),n=narrative(r),chosen=countChosen(),numeric=items.filter(i=>known(state.answers[i.id])||['yes','no'].includes(state.answers[i.id])).length;
 return `${state.example?`<div class="example-banner"><span><strong>Example profile</strong> · These are illustrative answers, not your results.</span><button class="text-link" data-action="start-fresh">Start yours →</button></div>`:''}<main id="main" class="results"><div class="eyebrow">Your AI flower</div><div class="result-heading"><div><h1 tabindex="-1" id="results-title">Your AI flower</h1><p><strong>${n.title}</strong> ${n.text}</p></div><button class="button-secondary" data-action="review">Review answers <span aria-hidden="true">↗</span></button></div><p class="coverage">${numeric} substantive responses · ${r.unsure+r.skipped} not sure / skip · ${34-chosen} not answered</p><div class="result-grid"><div>${chartPanel(r)}</div><div>${summaryCard(r)}${stretchCard(r)}${reflectionCard(r)}</div></div>${breakdown(r)}<div class="result-actions"><button class="button-primary" data-action="review">Review your answers <span aria-hidden="true">→</span></button><button class="button-secondary" data-action="open-card">Save flower card ↓</button><button class="text-link" data-action="print">Print your profile</button><button class="text-link" data-action="start-fresh">Start again</button></div><p class="result-disclaimer">Your flower is a snapshot of your answers.<br>Your responses are only held in this tab’s memory. Nothing is collected. <a href="scoring.html" target="_blank" rel="noopener">Read the full scoring and research ↗</a></p></main>`;
}
function render({scroll=false,focus=null}={}){if(scene){if(scene.isResult)state.view=scene.getView();scene.destroy();scene=null;}flowerCard=null;app.innerHTML=header()+(state.screen==='intro'?intro():state.screen==='quiz'?quiz():results())+footer()+method()+(state.screen==='results'?cardDialog():'');if(globalThis.__snowflakeOfflineLinks){document.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(globalThis.__snowflakeOfflineLinks[href])a.href=globalThis.__snowflakeOfflineLinks[href];});}mountScene();if(scroll)window.scrollTo({top:0,behavior:'instant'});if(focus)document.getElementById(focus)?.focus({preventScroll:true});}
function go(index){state.index=Math.max(0,Math.min(15,index));state.screen='quiz';render({scroll:true,focus:'question-title'});}
function showResults(){state.screen='results';state.spin=false;render({scroll:true,focus:'results-title'});}
function fresh(){scene?.destroy();scene=null;state.answers={};state.index=0;state.example=false;state.issue='EDU';state.view={};state.spin=false;go(0);}
function example(){state.answers={};for(const c of cards)for(const i of c.items)state.answers[i.id]=i.kind==='agreement'?2:i.kind==='yesno'?'no':2;Object.assign(state.answers,sampleAnswers());Object.assign(state.answers,{'CHG-P':3,'CHG-E':4,'CHG-S':4,'FEEL-M':4,'FEEL-C':0,'FEEL-I':0});state.example=true;showResults();}

function mountScene(){
 const canvas=document.getElementById('snowflake-canvas');
 if(!canvas||typeof canvas.getContext!=='function')return;
 const result=calculate(state.screen==='intro'?sampleAnswers():state.answers);
 try{
  scene=new SnowflakeRenderer(canvas,result,{
   view:state.screen==='results'?state.view:{},selected:state.issue,stem:true,
   onPause:()=>{state.spin=false;const button=document.querySelector('[data-action="spin"]');if(button)button.textContent='Rotate';},
   onSelect:id=>{if(state.screen!=='results')return;state.issue=id;const y=window.scrollY;render();window.scrollTo(0,y);},
   onProject:(points,view,bounds)=>{
    const slider=document.querySelector('#snowflake-relief'),output=document.querySelector('#relief-value');
    if(slider)slider.value=view.relief;if(output)output.textContent='×'+view.relief.toFixed(1);
    const leaders=document.querySelector('.petal-leaders');if(leaders)leaders.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
    for(const p of points){
     const label=document.querySelector(`[data-tip="${p.id}"]`);
     if(label){label.style.left=p.x+'px';label.style.top=p.y+'px';label.style.width=p.width+'px';label.style.height=p.height+'px';label.classList.add('placed');label.classList.toggle('active',p.id===state.issue);label.setAttribute('aria-pressed',String(p.id===state.issue));}
     const leader=document.querySelector(`[data-leader="${p.id}"]`);
     if(leader){const endX=p.side==='left'?p.x+p.width/2:p.side==='right'?p.x-p.width/2:p.x;const endY=p.side==='centre'?(p.y<p.tipY?p.y+p.height/2:p.y-p.height/2):p.y;leader.setAttribute('d',`M${p.tipX},${p.tipY} L${endX},${endY}`);leader.classList.toggle('active',p.id===state.issue);}
    }
   }
  });
  scene.isResult=state.screen==='results';
  if(state.screen==='results')scene.setSpin(state.spin);
 }catch(error){const note=document.createElement('p');note.className='renderer-error';note.textContent='This browser could not draw the flower. Your issue answers and scores are still available below.';canvas.parentElement.append(note);}
}

app.addEventListener('input',event=>{if(event.target.id!=='snowflake-relief')return;scene?.setRelief(Number(event.target.value));state.view=scene?.getView()??state.view;const output=document.querySelector('#relief-value');if(output)output.textContent='×'+Number(event.target.value).toFixed(1);});

app.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='home'){event.preventDefault();state.screen='intro';render({scroll:true});}else if(action==='start'){if(state.example)fresh();else go(state.index);}else if(action==='example')example();else if(action==='method')document.getElementById('method-dialog').showModal();else if(action==='close-method')document.getElementById('method-dialog').close();else if(action==='topic')go(Number(button.dataset.index));else if(action==='next'){if(state.index===15)showResults();else go(state.index+1);}else if(action==='back'){if(state.index)go(state.index-1);else{state.screen='intro';render({scroll:true});}}else if(action==='results')showResults();else if(action==='review')go(0);else if(action==='clear'){delete state.answers[button.dataset.item];render({focus:button.dataset.item+'-0'});}else if(action==='issue'){state.issue=button.dataset.issue;const y=window.scrollY;render();window.scrollTo(0,y);document.querySelector(`[data-issue="${state.issue}"][data-action="issue"]`)?.focus({preventScroll:true});}else if(action==='spin'){state.spin=!state.spin;scene?.setSpin(state.spin);button.textContent=state.spin?'Pause rotation':'Rotate';}else if(action==='reset-view'){scene?.reset();state.view=scene?.getView()??{};const slider=document.querySelector('#snowflake-relief');if(slider)slider.value=1;const output=document.querySelector('#relief-value');if(output)output.textContent='×1.0';}else if(action==='open-card')openFlowerCard();else if(action==='close-card')document.getElementById('flower-card-dialog').close();else if(action==='download-card-png'&&flowerCard)downloadFlowerCard(flowerCard,'png');else if(action==='download-card-svg'&&flowerCard)downloadFlowerCard(flowerCard,'svg');else if(action==='save-image'){scene?.savePNG();}else if(action==='start-fresh')fresh();else if(action==='print'){document.querySelectorAll('.breakdown details').forEach(d=>d.open=true);window.print();}});
app.addEventListener('change',event=>{if(event.target.id==='topic-select'){go(Number(event.target.value));return;}const input=event.target;if(!input.dataset.item)return;const value=input.dataset.value;state.answers[input.dataset.item]=/^[0-4]$/.test(value)?Number(value):value;const y=window.scrollY;render({focus:input.id});window.scrollTo(0,y);});
document.addEventListener('click',event=>{if(event.target.matches('dialog')){const rect=event.target.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)event.target.close();}});
render();

})();</script></body></html>
