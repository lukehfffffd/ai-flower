/* Issue-level atlas: the data traces and the decorative conflict edge are independent. */
.result-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.atlas-card{padding:24px;background:radial-gradient(ellipse at 45% 32%,#263b4538,transparent 65%),var(--panel);min-width:0}
.issue-map-svg,.depth-map-svg{font-family:var(--sans);overflow:visible}
.issue-map-key,.intro-art-key{display:flex;justify-content:center;align-items:center;gap:23px;font-size:11px;color:var(--muted);margin:15px 0 0}
.issue-map-key span,.intro-art-key span,.issue-answer>span{display:flex;align-items:center;gap:7px}
.benefit-key,.harm-key{display:inline-block;width:16px;height:6px;flex-shrink:0}
.benefit-key{border-top:2px solid var(--teal)}
.harm-key{border-top:2px dashed var(--coral)}
.intro-art-atlas{transform:rotate(.5deg);padding:24px;box-shadow:0 20px 80px #03091622}
.intro-art-atlas .issue-map-svg{margin:-12px 0 -22px}
.intro-art-key{margin:0 0 20px;gap:17px;font-size:10px}
.intro-art-atlas .art-caption{padding-top:17px}
.outline-key{display:flex;align-items:flex-start;gap:13px;padding:17px 0 18px;margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.outline-key strong{font-size:12px;font-weight:550;color:#e2d2bb}
.outline-key p{color:var(--muted);font-size:11px;line-height:1.7;margin:4px 0 0;max-width:460px}
.outline-icon{display:block;width:23px;height:23px;flex-shrink:0;margin-top:4px}
.outline-icon.smooth{border:1px solid #dfccaa;border-radius:50%}
.outline-icon.unknown{border:1px dashed #8090a8;border-radius:50%;opacity:.6}
.outline-icon.rough{background:#dfccaa;clip-path:polygon(50% 0%,57% 19%,69% 4%,70% 25%,89% 16%,82% 36%,100% 42%,81% 51%,97% 66%,76% 65%,81% 86%,63% 76%,56% 100%,47% 80%,31% 97%,32% 75%,11% 83%,20% 62%,0% 54%,20% 45%,4% 30%,25% 31%,20% 10%,40% 23%)}
.outline-demo{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:13px 0;color:var(--muted);font-size:11px}
.outline-demo>div{display:flex;gap:5px}
.outline-demo button{border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--bg);padding:6px 10px;font-size:11px;min-height:33px}
.outline-demo button[aria-pressed=true]{border-color:var(--yellow);color:var(--yellow);background:#ffdb7808}
.issue-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:19px 0 16px}
.issue-picker button{border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;gap:8px;min-height:41px;padding:9px 10px;background:#151b2938;color:var(--muted);text-align:left;font-size:11px;line-height:1.35;transition:border-color .15s,background .15s}
.issue-picker button>span{font-size:9px;font-variant-numeric:tabular-nums;letter-spacing:.5px;color:#788ba3}
.issue-picker button:hover{border-color:#9aa99f;background:#ffdb7805}
.issue-picker button[aria-pressed=true]{color:var(--yellow);border-color:#a99868;background:#ffdb7808}
.issue-picker button[aria-pressed=true]>span{color:var(--yellow)}
.issue-readout{border:1px solid var(--line);border-radius:6px;padding:13px 15px;background:#151b2940}
.issue-readout-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:9px}
.issue-readout-title h3{font-size:13px;font-weight:550;color:var(--text)}

nt:16px/1.6 var(--sans);color:var(--text);background:#111925;border:1px solid #728a77;border-radius:5px;padding:13px;min-height:100px}.wording-form textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}.wording-actions{display:flex;gap:12px;margin-top:12px}.wording-actions button{font-size:12px;min-height:36px;padding:8px 14px}.wording-form .wording-error{font-size:12px;color:#eea2a2;margin:8px 0 0}.editor-note{padding-top:20px;border-top:1px solid var(--line)}@media(max-width:600px){.editor-toolbar{align-items:stretch;flex-direction:column;gap:12px;padding:14px}.editor-toolbar .button-primary{align-self:flex-start}.wording-row{gap:15px}.wording-statement{padding:15px}.wording-row .wording-text{font-size:15px}.edit-topic{margin-bottom:40px}}\n</style></head><body><header class=\"doc-header\"><a class=\"brand\" href=\"#\">✳ <span>AI Flower</span></a><a class=\"text-link\" href=\"questions.md\" download>Original wording ↓</a></header><main class=\"document question-editor\" id=\"question-editor\"><p class=\"text-link\">Close this tab to return to the questionnaire.</p><h1 id=\"find-out-what-type-of-ai-flower-you-are\">Find out what type of AI flower you are</h1>\n<h2 id=\"about-the-questions\">About the questions</h2>\n<p>15 topics. Where do you actually stand on AI?</p>\n<p>You can love the tool and distrust the company. You can think the hype is ridiculous and still expect the technology to change everything. You can also think the whole thing is mostly hot air.</p>\n<p>Rate each statement separately. Agree with both if both fit. Disagree with both if neither does. You don&#x27;t have to split the difference.</p>\n<p>Answer as a student, an educator, or both. Some cards ask about AI today; most look five years ahead. Here, AI includes tools that generate content, analyse information or help make decisions.</p>\n<p>“Not sure / skip” is one choice. It leaves that statement unscored. These are views to react to, not facts you&#x27;re expected to accept.</p>\n<h2 id=\"response-formats\">Response formats</h2>\n<p><strong>Agreement:</strong> Strongly disagree (0) · Disagree (1) · Neither agree nor disagree (2) · Agree (3) · Strongly agree (4). Also: Not sure / skip.</p>\n<p><strong>Amount of change:</strong> None (0) · Small (1) · Moderate (2) · Large (3) · Fundamental (4). Also: Not sure / skip.</p>\n<p><strong>Reflection:</strong> Not at all (0) · A little (1) · Somewhat (2) · Quite a lot (3) · Very much (4). Also: Not sure / skip.</p>\n<p>The item codes below connect each statement to the scoring explanation.</p>\n<h2 id=\"the-15-topics\">The 15 topics</h2>\n<h3 id=\"1-ai-consciousness\">1. AI consciousness</h3>\n<p><strong>Could AI be conscious, and what would we owe it?</strong></p>\n<ul>\n<li><strong>CON-1:</strong> Some of today&#x27;s AIs may have an inner experience; being an AI could feel like something.</li>\n<li><strong>CON-2:</strong> The people building future AI should take the possibility of AI suffering seriously.</li>\n</ul>\n<h3 id=\"2-creative-work\">2. Creative work</h3>\n<p><strong>What does AI mean for creativity and creative work?</strong></p>\n<ul>\n<li><strong>CRE-B:</strong> People with ideas but none of the training are finally able to make the things in their heads.</li>\n<li><strong>CRE-H:</strong> Making a living from art, writing or music will get harder when a machine can produce a cheap alternative in seconds.</li>\n</ul>\n<h3 id=\"3-jobs-and-the-economy\">3. Jobs and the economy</h3>\n<p><strong>What will generative and agentic AI do to jobs and working life?</strong></p>\n<ul>\n<li><strong>JOB-B:</strong> AI will take a real bite out of the boring work people currently lose their days to.</li>\n<li><strong>JOB-H:</strong> AI will put people out of work faster than they can find a decent way back in.</li>\n</ul>\n<h3 id=\"4-information-and-truth\">4. Information and truth</h3>\n<p><strong>How will AI affect our ability to work out what&#x27;s true?</strong></p>\n<ul>\n<li><strong>INF-B:</strong> More people will be able to get their heads around difficult subjects without needing an expert.</li>\n<li><strong>INF-H:</strong> When convincing nonsense is almost free to produce, working out what&#x27;s true becomes much harder.</li>\n</ul>\n<h3 id=\"5-the-ai-industry\">5. The AI industry</h3>\n<p><strong>How much do you trust the companies building AI?</strong></p>\n<ul>\n<li><strong>IND-1:</strong> The sales pitch is way above what the products actually deliver.</li>\n<li><strong>IND-2:</strong> If their products cause real harm, I trust AI companies to do the right thing, even when it costs them.</li>\n</ul>\n<h3 id=\"6-existential-risk\">6. Existential risk</h3>\n<p><strong>Could AI threaten humanity&#x27;s survival?</strong></p>\n<ul>\n<li><strong>EXI-1:</strong> A future AI catastrophe that could threaten humanity&#x27;s survival is a real possibility.</li>\n<li><strong>EXI-2:</strong> We should put serious effort into preventing an AI catastrophe now, even if the odds are it won&#x27;t happen.</li>\n</ul>\n<h3 id=\"7-your-use-of-ai\">7. Your use of AI</h3>\n<p><strong>How does AI fit into your own life?</strong></p>\n<ul>\n<li><strong>USE-1:</strong> How often have you chosen to use an AI tool? Never · Less than weekly · Weekly · Several days a week · Daily or almost daily · Not sure / skip.</li>\n<li><strong>USE-2:</strong> Has a course, school or workplace expected you to use AI, whether you wanted to or not? No · Yes · Not sure / skip.</li>\n</ul>\n<h3 id=\"8-healthcare\">8. Healthcare</h3>\n<p><strong>What will AI change in healthcare?</strong></p>\n<ul>\n<li><strong>MED-B:</strong> AI will help clinicians catch illnesses earlier.</li>\n<li><strong>MED-H:</strong> Patients will be seriously hurt because an AI got something wrong.</li>\n</ul>\n<h3 id=\"9-training-data-and-consent\">9. Training data and consent</h3>\n<p><strong>What say should people have when their work is used to train AI?</strong></p>\n<ul>\n<li><strong>DAT-1:</strong> If your work is going into an AI training set, you should get a real say in the matter.</li>\n<li><strong>DAT-2:</strong> Training on publicly available material is fair enough without asking every person who contributed to it.</li>\n</ul>\n<h3 id=\"10-learning-and-teaching\">10. Learning and teaching</h3>\n<p><strong>What will AI mean for how students learn?</strong></p>\n<ul>\n<li><strong>EDU-B:</strong> AI gives learners useful explanations and feedback when there&#x27;s nobody around to ask.</li>\n<li><strong>EDU-H:</strong> Students will get very good at producing the answer without doing the thinking they were supposed to learn from.</li>\n</ul>\n<h3 id=\"11-regulation-and-oversight-for-learners\">11. Regulation and oversight for learners</h3>\n<p><strong>What rules should apply to AI in education?</strong></p>\n<ul>\n<li><strong>REG-1:</strong> Teachers and students should have room to try AI on low-stakes tasks without getting permission for every experiment.</li>\n<li><strong>REG-2:</strong> If AI is going to help decide a student&#x27;s future, someone human and independent should check what is being decided and how.</li>\n</ul>\n<h3 id=\"12-artificial-general-intelligence\">12. Artificial general intelligence</h3>\n<p><strong>Will we build AI that can do most intellectual tasks a human can?</strong></p>\n<ul>\n<li><strong>AGI-1:</strong> Within five years, we&#x27;ll probably have AI that can handle most intellectual tasks a human can.</li>\n<li><strong>AGI-2:</strong> We could miss AGI entirely and still end up with specialised tools that turn society upside down.</li>\n</ul>\n<h3 id=\"13-who-benefits\">13. Who benefits?</h3>\n<p><strong>Who gains from AI, and who holds the power?</strong></p>\n<ul>\n<li><strong>DIS-B:</strong> People who could never afford expert help will finally get access to something useful.</li>\n<li><strong>DIS-H:</strong> A handful of companies will end up with even more control over how the rest of us earn a living.</li>\n</ul>\n<h3 id=\"14-the-next-five-years\">14. The next five years</h3>\n<p><strong>How much will AI change things over the next five years?</strong></p>\n<ul>\n<li><strong>CHG-P:</strong> Your own learning, teaching or working day: how much will AI have changed it?</li>\n<li><strong>CHG-E:</strong> The way schools, colleges and universities run: how much will AI have changed it?</li>\n<li><strong>CHG-S:</strong> Life beyond the classroom: how much will AI have changed society?</li>\n</ul>\n<h3 id=\"15-the-environment\">15. The environment</h3>\n<p><strong>How do AI&#x27;s environmental costs and benefits add up?</strong></p>\n<ul>\n<li><strong>ENV-B:</strong> AI will help us find ways to cut environmental damage that we wouldn&#x27;t have found without it.</li>\n<li><strong>ENV-H:</strong> Keeping AI running will put a serious strain on energy and water supplies.</li>\n</ul>\n<h2 id=\"final-reflection-where-does-all-that-leave-you\">Final reflection: where does all that leave you?</h2>\n<ul>\n<li><strong>FEEL-M:</strong> How much does AI leave you with a mixture of positive and negative feelings?</li>\n<li><strong>FEEL-C:</strong> How much do those feelings pull you in opposite directions?</li>\n<li><strong>FEEL-I:</strong> How hard is it to work out where you stand on AI overall?</li>\n</ul></main><footer class=\"footer\">Nothing is collected on this form</footer><script>(()=>{const cards=[\n  {\n    \"id\": 1,\n    \"title\": \"AI consciousness\",\n    \"prompt\": \"Could AI be conscious, and what would we owe it?\",\n    \"intro\": \"\",\n    \"items\": [\n      {\n        \"id\": \"CON-1\",\n        \"text\": \"Some of today's AIs may have an inner experience; being an AI could feel like something.\",\n        \"kind\": \"agreement\"\n      },\n      {\n        \"id\": \"CON-2\",\n        \"text\": \"The people building future AI should take the possibility of AI suffering seriously.\",\n        \"kind\": \"agreement\"\n      }\n    ]\n  },\n  {\n    \"id\": 2,\n l probably have AI that can handle most intellectual tasks a human can.\",\n        \"kind\": \"agreement\"\n      },\n      {\n        \"id\": \"AGI-2\",\n        \"text\": \"We could miss AGI entirely and still end up with specialised tools that turn society upside down.\",\n        \"kind\": \"agreement\"\n      }\n    ]\n  },\n  {\n    \"id\": 13,\n    \"title\": \"Who benefits?\",\n    \"prompt\": \"Who gains from AI, and who holds the power?\",\n    \"intro\": \"\",\n    \"items\": [\n      {\n        \"id\": \"DIS-B\",\n        \"text\": \"People who could never afford expert help will finally get access to something useful.\",\n        \"kind\": \"agreement\"\n      },\n      {\n        \"id\": \"DIS-H\",\n        \"text\": \"A handful of companies will end up with even more control over how the rest of us earn a living.\",\n        \"kind\": \"agreement\"\n      }\n    ]\n  },\n  {\n    \"id\": 14,\n    \"title\": \"The next five years\",\n    \"prompt\": \"How much will AI change things over the next five years?\",\n    \"intro\": \"\",\n    \"items\": [\n      {\n        \"id\": \"CHG-P\",\n        \"text\": \"Your own learning, teaching or working day: how much will AI have changed it?\",\n        \"kind\": \"change\"\n      },\n      {\n        \"id\": \"CHG-E\",\n        \"text\": \"The way schools, colleges and universities run: how much will AI have changed it?\",\n        \"kind\": \"change\"\n      },\n      {\n        \"id\": \"CHG-S\",\n        \"text\": \"Life beyond the classroom: how much will AI have changed society?\",\n        \"kind\": \"change\"\n      }\n    ]\n  },\n  {\n    \"id\": 15,\n    \"title\": \"The environment\",\n    \"prompt\": \"How do AI's environmental costs and benefits add up?\",\n    \"intro\": \"\",\n    \"items\": [\n      {\n        \"id\": \"ENV-B\",\n        \"text\": \"AI will help us find ways to cut environmental damage that we wouldn't have found without it.\",\n        \"kind\": \"agreement\"\n      },\n      {\n        \"id\": \"ENV-H\",\n        \"text\": \"Keeping AI running will put a serious strain on energy and water supplies.\",\n        \"kind\": \"agreement\"\n      }\n    ]\n  },\n  {\n    \"id\": 16,\n    \"title\": \"Holding both sides\",\n    \"prompt\": \"Where does all that leave you?\",\n    \"intro\": \"\",\n    \"items\": [\n      {\n        \"id\": \"FEEL-M\",\n        \"text\": \"How much does AI leave you with a mixture of positive and negative feelings?\",\n        \"kind\": \"reflection\"\n      },\n      {\n        \"id\": \"FEEL-C\",\n        \"text\": \"How much do those feelings pull you in opposite directions?\",\n        \"kind\": \"reflection\"\n      },\n      {\n        \"id\": \"FEEL-I\",\n        \"text\": \"How hard is it to work out where you stand on AI overall?\",\n        \"kind\": \"reflection\"\n      }\n    ]\n  }\n];\nconst adoptedCorrections={\"item:CON-1\": {\"submitted\": \"Some of today's AIs may have an inner experience; being an AI could feel like something\", \"published\": \"Some of today's AIs may have an inner experience; being an AI could feel like something.\"}, \"item:REG-2\": {\"submitted\": \"If AI is going to help decide a student's future, someone human and independent should check what's is being decided and how\", \"published\": \"If AI is going to help decide a student's future, someone human and independent should check what is being decided and how.\"}};\nfunction wordingFields(cards){\n return cards.flatMap(card=>[\n  ...['title','prompt'].map(name=>({key:`topic:${card.id}:${name}`,text:card[name],label:({title:'Topic title',prompt:'Question heading'})[name],cardId:card.id})),\n  ...card.items.map((item,i)=>({key:`item:${item.id}`,text:item.text,label:`${item.kind==='reflection'?'Reflection':'Statement'} ${i+1}`,cardId:card.id}))\n ]);\n}\nfunction reviseWording(cards,key,text){\n if(typeof text!=='string'||!text.trim())throw Error('Add some wording before saving.');\n if(!wordingFields(cards).some(f=>f.key===key))throw Error('Unknown question.');\n return cards.map(card=>({...card,\n  ...Object.fromEntries(['title','prompt'].filter(name=>key===`topic:${card.id}:${name}`).map(name=>[name,text.trim()])),\n  items:card.items.map(item=>({...item,text:key===`item:${item.id}`?text.trim():item.text}))\n }));\n}\nfunction questionChanges(original,draft){\n const before=new Map(wordingFields(original).map(f=>[f.key,f]));\n return wordingFields(draft).filter(f=>before.has(f.key)&&before.get(f.key).text!==f.text).map(f=>({key:f.key,label:f.label,original:before.get(f.key).text,revised:f.text}));\n}\nfunction restoreQuestionDraft(original,saved){\n let draft=original;\n if(saved?.format!=='ai-flower-question-draft'||saved?.schema!==1||!saved.wording||typeof saved.wording!=='object')return draft;\n for(const field of wordingFields(original)){\n  const text=saved.wording[field.key];\n  const adopted=adoptedCorrections[field.key];\n  if(adopted&&text===adopted.submitted&&field.text===adopted.published)continue;\n  if(typeof text==='string'&&text.trim())draft=reviseWording(draft,field.key,text);\n }\n return draft;\n}\nfunction exportQuestionDraft(original,draft){\n const changes=questionChanges(original,draft);\n return {format:'ai-flower-question-draft',schema:1,wording:Object.fromEntries(changes.map(c=>[c.key,c.revised])),changes,questions:draft};\n}\n\n\n\nconst editor=document.getElementById('question-editor');\nconst storageKey='ai-flower-question-draft';\nconst escapeText=value=>String(value).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nlet draft=cards,storageAvailable=true;\ntry{const saved=localStorage.getItem(storageKey);if(saved)draft=restoreQuestionDraft(cards,JSON.parse(saved));}catch{storageAvailable=false;}\nconst fieldFor=key=>wordingFields(draft).find(f=>f.key===key);\nfunction readRow(field){return `<div class=\"wording-copy\"><span class=\"wording-label\">${field.label}</span><p class=\"wording-text\">${escapeText(field.text)}</p></div><button class=\"button-secondary edit-wording\" data-edit=\"${field.key}\" aria-label=\"Edit ${escapeText(field.label.toLowerCase())}: ${escapeText(field.text)}\">Edit</button>`;}\nfunction render(){\n const fields=wordingFields(draft);\n editor.innerHTML=`<a class=\"text-link\" href=\"./\">← Back to the questionnaire</a><h1>All questions</h1><p class=\"editor-intro\">Edit any heading or statement below. Your wording is saved as a draft in this browser. Download the draft when you're ready to review it.</p><div class=\"editor-toolbar\"><div><strong>34 statements · 15 topics + final reflection</strong><p id=\"draft-status\" role=\"status\" aria-live=\"polite\"></p></div><button class=\"button-primary\" id=\"download-question-draft\">Download draft ↓</button></div>${draft.map((card,index)=>`<section class=\"edit-topic\" aria-labelledby=\"editor-topic-${card.id}\"><h2 id=\"editor-topic-${card.id}\">${index===15?'Final reflection':`Topic ${String(index+1).padStart(2,'0')}`}</h2>${fields.filter(f=>f.cardId===card.id).map(f=>`<div class=\"wording-row ${f.key.startsWith('item:')?'wording-statement':''}\" data-field=\"${f.key}\">${readRow(f)}</div>`).join('')}</section>`).join('')}<p class=\"editor-note\">Saving edits here changes your local draft. The published questionnaire keeps its current wording until the draft is applied.</p>`;\n updateStatus();\n}\nfunction updateStatus(){\n const count=questionChanges(cards,draft).length;\n editor.querySelector('#draft-status').textContent=storageAvailable?`${count} ${count===1?'edit':'edits'} saved in this browser.`:`${count} ${count===1?'edit':'edits'} in this tab. Browser storage is unavailable; download your draft to keep it.`;\n}\nfunction persist(){\n try{localStorage.setItem(storageKey,JSON.stringify(exportQuestionDraft(cards,draft)));storageAvailable=true;}catch{storageAvailable=false;}\n updateStatus();\n}\nfunction rowFor(key){return [...editor.querySelectorAll('[data-field]')].find(row=>row.dataset.field===key);}\nfunction saveForm(form){\n const input=form.querySelector('textarea'),key=form.dataset.editing;\n try{draft=reviseWording(draft,key,input.value);}catch(error){form.querySelector('.wording-error').textContent=error.message;input.focus();return false;}\n persist();const row=rowFor(key);row.innerHTML=readRow(fieldFor(key));row.querySelector('button').focus({preventScroll:true});return true;\n}\nfunction downloadDraft(){\n for(const form of [...editor.querySelectorAll('[data-editing]')])if(!saveForm(form))return;\n const blob=new Blob([JSON.stringify(exportQuestionDraft(cards,draft),null,2)+'\\n'],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');\n link.href=url;link.download='ai-flower-edited-questions.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000);\n}\neditor.addEventListener('click',event=>{\n const edit=event.target.closest('[data-edit]');\n if(edit){\n  const key=edit.dataset.edit,field=fieldFor(key),row=rowFor(key),id='wording-'+key.replaceAll(':','-');\n  row.innerHTML=`<form class=\"wording-form\" data-editing=\"${key}\"><label for=\"${id}\">${field.label}</label><textarea id=\"${id}\" rows=\"${field.text.length>150?5:3}\" required>${escapeText(field.text)}</textarea><p class=\"wording-error\" role=\"alert\"></p><div class=\"wording-actions\"><button class=\"button-primary\" type=\"submit\">Save wording</button><button class=\"button-secondary\" type=\"button\" data-cancel=\"${key}\">Cancel</button></div></form>`;\n  row.querySelector('textarea').focus();return;\n }\n const cancel=event.target.closest('[data-cancel]');\n if(cancel){const row=rowFor(cancel.dataset.cancel);row.innerHTML=readRow(fieldFor(cancel.dataset.cancel));row.querySelector('button').focus({preventScroll:true});return;}\n if(event.target.closest('#download-question-draft'))downloadDraft();\n});\neditor.addEventListener('submit',event=>{if(!event.target.matches('[data-editing]'))return;event.preventDefault();saveForm(event.target);});\nwindow.addEventListener('beforeunload',event=>{\n const unsaved=[...editor.querySelectorAll('[data-editing]')].some(form=>form.querySelector('textarea').value!==fieldFor(form.dataset.editing).text);\n if(unsaved){event.preventDefault();event.returnValue='';}\n});\nrender();\n\n})();<\/script></body></html>", "questions.md": "# Find out what type of AI flower you are\n\n\n## About the questions\n\n15 topics. Where do you actually stand on AI?\n\nYou can love the tool and distrust the company. You can think the hype is ridiculous and still expect the technology to change everything. You can also think the whole thing is mostly hot air.\n\nRate each statement separately. Agree with both if both fit. Disagree with both if neither does. You don't have to split the difference.\n\nAnswer as a student, an educator, or both. Some cards ask about AI today; most look five years ahead. Here, AI includes tools that generate content, analyse information or help make decisions.\n\n“Not sure / skip” is one choice. It leaves that statement unscored. These are views to react to, not facts you're expected to accept.\n\n## Response formats\n\n**Agreement:** Strongly disagree (0) · Disagree (1) · Neither agree nor disagree (2) · Agree (3) · Strongly agree (4). Also: Not sure / skip.\n\n**Amount of change:** None (0) · Small (1) · Moderate (2) · Large (3) · Fundamental (4). Also: Not sure / skip.\n\n**Reflection:** Not at all (0) · A little (1) · Somewhat (2) · Quite a lot (3) · Very much (4). Also: Not sure / skip.\n\nThe item codes below connect each statement to the scoring explanation.\n\n## The 15 topics\n\n### 1. AI consciousness\n\n**Could AI be conscious, and what would we owe it?**\n\n- **CON-1:** Some of today's AIs may have an inner experience; being an AI could feel like something.\n- **CON-2:** The people building future AI should take the possibility of AI suffering seriously.\n\n### 2. Creative work\n\n**What does AI mean for creativity and creative work?**\n\n- **CRE-B:** People with ideas but none of the training are finally able to make the things in their heads.\n- **CRE-H:** Making a living from art, writing or music will get harder when a machine can produce a cheap alternative in seconds.\n\n### 3. Jobs and the economy\n\n**What will generative and agentic AI do to jobs and working life?**\n\n- **JOB-B:** AI will take a real bite out of the boring work people currently lose their days to.\n- **JOB-H:** AI will put people out of work faster than they can find a decent way back in.\n\n### 4. Information and truth\n\n**How will AI affect our ability to work out what's true?**\n\n- **INF-B:** More people will be able to get their heads around difficult subjects without needing an expert.\n- **INF-H:** When convincing nonsense is almost free to produce, working out what's true becomes much harder.\n\n### 5. The AI industry\n\n**How much do you trust the companies building AI?**\n\n- **IND-1:** The sales pitch is way above what the products actually deliver.\n- **IND-2:** If their products cause real harm, I trust AI companies to do the right thing, even when it costs them.\n\n### 6. Existential risk\n\n**Could AI threaten humanity's survival?**\n\n- **EXI-1:** A future AI catastrophe that could threaten humanity's survival is a real possibility.\n- **EXI-2:** We should put serious effort into preventing an AI catastrophe now, even if the odds are it won't happen.\n\n### 7. Your use of AI\n\n**How does AI fit into your own life?**\n\n- **USE-1:** How often have you chosen to use an AI tool? Never · Less than weekly · Weekly · Several days a week · Daily or almost daily · Not sure / skip.\n- **USE-2:** Has a course, school or workplace expected you to use AI, whether you wanted to or not? No · Yes · Not sure / skip.\n\n### 8. Healthcare\n\n**What will AI change in healthcare?**\n\n- **MED-B:** AI will help clinicians catch illnesses earlier.\n- **MED-H:** Patients will be seriously hurt because an AI got something wrong.\n\n### 9. Training data and consent\n\n**What say should people have when their work is used to train AI?**\n\n- **DAT-1:** If your work is going into an AI training set, you should get a real say in the matter.\n- **DAT-2:** Training on publicly available material is fair enough without asking every person who contributed to it.\n\n### 10. Learning and teaching\n\n**What will AI mean for how students learn?**\n\n- **EDU-B:** AI gives learners useful explanations and feedback when there's nobody around to ask.\n- **EDU-H:** Students will get very good at producing the answer without doing the thinking they were supposed to learn from.\n\n### 11. Regulation and oversight for learners\n\n**What rules should apply to AI in education?**\n\n- **REG-1:** Teachers and students should have room to try AI on low-stakes tasks without getting permission for every experiment.\n- **REG-2:** If AI is going to help decide a student's future, someone human and independent should check what is being decided and how.\n\n### 12. Artificial general intelligence\n\n**Will we build AI that can do most intellectual tasks a human can?**\n\n- **AGI-1:** Within five years, we'll probably have AI that can handle most intellectual tasks a human can.\n- **AGI-2:** We could miss AGI entirely and still end up with specialised tools that turn society upside down.\n\n### 13. Who benefits?\n\n**Who gains from AI, and who holds the power?**\n\n- **DIS-B:** People who could never afford expert help will finally get access to something useful.\n- **DIS-H:** A handful of companies will end up with even more control over how the rest of us earn a living.\n\n### 14. The next five years\n\n**How much will AI change things over the next five years?**\n\n- **CHG-P:** Your own learning, teaching or working day: how much will AI have changed it?\n- **CHG-E:** The way schools, colleges and universities run: how much will AI have changed it?\n- **CHG-S:** Life beyond the classroom: how much will AI have changed society?\n\n### 15. The environment\n\n**How do AI's environmental costs and benefits add up?**\n\n- **ENV-B:** AI will help us find ways to cut environmental damage that we wouldn't have found without it.\n- **ENV-H:** Keeping AI running will put a serious strain on energy and water supplies.\n\n## Final reflection: where does all that leave you?\n\n- **FEEL-M:** How much does AI leave you with a mixture of positive and negative feelings?\n- **FEEL-C:** How much do those feelings pull you in opposite directions?\n- **FEEL-I:** How hard is it to work out where you stand on AI overall?\n", "scoring.html": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"theme-color\" content=\"#151b29\"><title>Full scoring & research · AI Flower</title><style>:root{color-scheme:dark;--bg:#151b29;--panel:#1c2434;--panel2:#202b3d;--line:#344055;--muted:#aab5c7;--text:#edf1f7;--yellow:#ffdb78;--teal:#80d6c3;--coral:#f3a794;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans)}button,input{font:inherit}a{color:inherit;text-underline-offset:4px}button,a,label{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:default;opacity:.35}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:5px}::selection{background:#ffdb7833;color:#fff}h1,h2,h3,p{margin:0}h1,h2,h3{line-height:1.16}button{color:inherit}svg{display:block;max-width:100%}.skip-link{position:fixed;top:-100px;left:20px;background:var(--yellow);color:var(--bg);padding:10px;z-index:20}.skip-link:focus{top:10px}\n.site-header,.doc-header{max-width:1360px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:26px 48px;border-bottom:1px solid var ;margin-bottom:0}\n@media(max-width:1000px){.header-links{gap:13px}.snowflake-card{padding:18px}}\n@media(max-width:760px){.header-links .compare-link{display:none}.snowflake-card{padding:17px}.snowflake-stage{aspect-ratio:1;min-height:280px}.snowflake-intro{transform:none;max-width:440px;width:100%;padding:20px}.snowflake-intro .snowflake-stage{min-height:280px}.snowflake-intro .art-caption p{font-size:19px}.snowflake-tip-labels span{min-width:21px;height:21px;font-size:9px}.snowflake-tools{gap:15px}.snowflake-ramp{font-size:9px;gap:8px}.issue-picker button{gap:6px}}\n@media print{.snowflake-tools,.snowflake-tip-labels,.stage-hint{display:none}.snowflake-card{background:white}.snowflake-ramp{color:#333}}\n.intro h1{font-size:clamp(43px,5.3vw,70px);line-height:1.09}\n.brand>span{letter-spacing:-.35px}\n.snowflake-intro .art-caption p{font-size:20px}\n@media(max-width:760px){.petal-label{font-size:11px;padding:4px 5px;line-height:1.18}.intro h1{font-size:47px}.snowflake-intro .art-caption p{font-size:18px}}\n@media(max-width:360px){.intro h1{font-size:40px}.petal-label{font-size:11px}}\n</style></head><body><header class=\"doc-header\"><a class=\"brand\" href=\"#\">✳ <span>AI Flower</span></a><a class=\"text-link\" href=\"scoring.md\" download>Download Markdown ↗</a></header><main class=\"document\"><p class=\"text-link\">Close this tab to return to the questionnaire.</p><h1 id=\"ai-flower-scoring-and-interpretation\">AI Flower: scoring and interpretation</h1>\n<p>AI Flower shows where you see promise, where you see harm, and where you see both. It also asks how much change you expect and how you feel about it.</p>\n<p>“Stretch” means agreeing with both the benefit and harm statement about the same issue. You can hold both views without feeling torn. Mixed feelings, inner conflict and difficulty deciding are asked about separately.</p>\n<p>The result describes your answers at this moment. It is not a personality diagnosis.</p>\n<h2 id=\"item-map\">Item map</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>Summary</th><th>Items</th><th>Interpretation</th></tr></thead><tbody>\n<tr><td>Benefit expectations</td><td>CRE-B, JOB-B, INF-B, MED-B, EDU-B, DIS-B, ENV-B</td><td>Average agreement with seven selected benefit expectations</td></tr>\n<tr><td>Harm expectations</td><td>CRE-H, JOB-H, INF-H, MED-H, EDU-H, DIS-H, ENV-H</td><td>Average agreement with seven selected harm expectations</td></tr>\n<tr><td>Expected change</td><td>CHG-P, CHG-E, CHG-S</td><td>Size of expected change in personal activity, education and society</td></tr>\n<tr><td>Stretch / both-and</td><td>The seven matching B/H topic pairs</td><td>How often both expectations are endorsed within the same topic</td></tr>\n<tr><td>Experienced ambivalence</td><td>FEEL-M, FEEL-C, FEEL-I, shown individually</td><td>Mixed reactions, inner conflict and difficulty deciding</td></tr>\n<tr><td>Context and principles</td><td>All remaining items</td><td>Displayed as their own answers; excluded from the headline scores</td></tr>\n</tbody></table></div>\n<p>Consciousness, corporate trust, use frequency, consent, precaution and regulation do not carry hidden optimism or pessimism points. Questions about existential risk are shown as individual answers because they concern longer-term possibilities, rather than the five-year effects covered by the benefit and harm summaries.</p>\n<h2 id=\"1-benefits-and-harms-what-the-scores-mean\">1. Benefits and harms: what the scores mean</h2>\n<p>Benefits and harms each have their own score. Agreeing with a harm statement does not reduce your benefit score, or vice versa.</p>\n<p>Each answer has a value from 0 to 4. The score is the average of your answered statements, multiplied by 25:</p>\n<pre><code>Score = average answer × 25</code></pre>\n<div class=\"table-scroll\"><table><thead><tr><th>Score</th><th>Average response</th></tr></thead><tbody>\n<tr><td>0</td><td>Strongly disagree</td></tr>\n<tr><td>25</td><td>Disagree</td></tr>\n<tr><td>50</td><td>Neither agree nor disagree</td></tr>\n<tr><td>75</td><td>Agree</td></tr>\n<tr><td>100</td><td>Strongly agree</td></tr>\n</tbody></table></div>\n<p>These numbers describe agreement with the statements. They are not probabilities, percentages of people or rankings against other respondents.</p>\n<p>A score of 50 can come from neutral answers throughout, or from strong agreement on some issues and strong disagreement on others. The answer breakdown shows which is the case.</p>\n<p>Each of the seven issues has equal weight. A score appears once at least four of its seven statements have a substantive answer. The number answered is shown alongside it. “Not sure / skip” and unanswered statements are left out; the neutral answer counts as 2. Scores are rounded to the nearest whole number, with halves rounded up.</p>\n<p>The four-answer minimum is a practical coverage rule, not a validated threshold. Scores based on different sets of answered issues may not be directly comparable.</p>\n<h2 id=\"2-how-much-change-you-expect\">2. How much change you expect</h2>\n<p>Three questions ask how much AI will change your learning, teaching or work; education; and society over the next five years. They ask about the amount of change, whether you welcome it or not.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Answer</th><th>Value on the 0–100 scale</th></tr></thead><tbody>\n<tr><td>None</td><td>0</td></tr>\n<tr><td>Small</td><td>25</td></tr>\n<tr><td>Moderate</td><td>50</td></tr>\n<tr><td>Large</td><td>75</td></tr>\n<tr><td>Fundamental</td><td>100</td></tr>\n</tbody></table></div>\n<p>The overall score is the average across all three settings. It appears only when all three questions have substantive answers. Your answers for each setting are also shown, so a small expected change in your own day does not hide a large expected change in society.</p>\n<p>AI use frequency and beliefs about artificial general intelligence do not affect this score.</p>\n<h2 id=\"3-where-you-see-both-benefit-and-harm\">3. Where you see both benefit and harm</h2>\n<p>Seven issues have a matching benefit and harm statement. A topic counts as “both/and” when you answer Agree or Strongly agree to both.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Your answers within an issue</th><th>How it is described</th></tr></thead><tbody>\n<tr><td>Agree or strongly agree with both statements</td><td>You see both</td></tr>\n<tr><td>Agree or strongly agree only with the benefit statement</td><td>You see benefit</td></tr>\n<tr><td>Agree or strongly agree only with the harm statement</td><td>You see harm</td></tr>\n<tr><td>Neither statement receives agreement</td><td>Neither view is endorsed</td></tr>\n<tr><td>Either answer is missing or Not sure / skip</td><td>Incomplete pair</td></tr>\n</tbody></table></div>\n<p>“Neither endorsed” includes neutral and disagreeing answers. It does not mean you are indifferent. Your original ratings remain visible.</p>\n<p>The result gives a count, such as:</p>\n<blockquote>You agreed with both the benefit and harm statement in 5 of 7 comparable topics.</blockquote>\n<p>This count appears once at least four pairs are complete. It includes only topics where both answers are known. Seeing benefit in healthcare and harm in jobs does not count as seeing both within either issue.</p>\n<p>The equivalent percentage is the number of both/and topics divided by the number of complete pairs, multiplied by 100. The count is shown because it makes the coverage clearer. A change from Neutral to Agree can change that count; it does not establish a sudden change in your feelings. This is a description of the chosen answers, not a validated ambivalence scale or a basis for ranking people.</p>\n<h2 id=\"4-how-it-feels-to-you\">4. How it feels to you</h2>\n<p>The final three questions ask about mixed feelings, inner conflict and difficulty deciding. Each answer is shown on its own, from Not at all to Very much. Missing answers stay unscored.</p>\n<p>These are different experiences. You may see benefits and harms clearly while feeling settled about your position. You may also feel torn for reasons the seven paired issues do not capture.</p>\n<p>Only your direct answer about inner conflict supports a statement that you feel torn. The both/and count does not supply that answer.</p>\n<h2 id=\"5-reading-your-flower-and-card\">5. Reading your flower and card</h2>\n<p>Each of the seven petals represents one issue: creative work, jobs, information and truth, healthcare, learning and teaching, who benefits, or the environment.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Feature</th><th>What it shows</th></tr></thead><tbody>\n<tr><td>Green through yellow to red</td><td>Your benefit rating compared with your harm rating. Green leans towards benefit; red towards harm; yellow means equal ratings.</td></tr>\n<tr><td>Petal length</td><td>How strongly you agree with either statement. Stronger agreement makes a longer petal.</td></tr>\n<tr><td>Smooth or jagged texture</td><td>Agreement with both statements. Agreeing with both adds texture; strongly agreeing with both adds deeper texture.</td></tr>\n<tr><td>Rising or drooping tips</td><td>The same benefit–harm balance as the colour: green rises, red droops.</td></tr>\n<tr><td>Short, smooth petal</td><td>Neither statement received agreement.</td></tr>\n<tr><td>Grey petal</td><td>One or both answers are missing or Not sure / skip.</td></tr>\n<tr><td>Stem</td><td>Decoration. It carries no score.</td></tr>\n</tbody></table></div>\n<p>Yellow can mean strong agreement with both statements, neutrality on both, or disagreement with both. Petal length, texture and the answer readout distinguish these cases. Jaggedness shows both/and in your answers; it does not show how distressed or conflicted you feel.</p>\n<h3 id=\"how-the-petal-is-calculated\">How the petal is calculated</h3>\n<p>Colour follows the difference between the two original 0–4 ratings: <code>(benefit − harm) ÷ 4</code>. Equal ratings produce yellow.</p>\n<p>For length and texture, each rating becomes 0 for Strongly disagree, Disagree or Neutral; 0.5 for Agree; and 1 for Strongly agree. Length follows the larger of these two values. Texture follows the smaller, so it increases only when both statements receive agreement. These values set the drawing, not a new psychological score.</p>\n<p>Petal width and the stem are decorative. The rise or droop repeats the colour signal. Turning, zooming and the Visual relief control change your view of the flower, not your answers. Its area, volume and overall colour are not scored.</p>\n<h3 id=\"saving-your-flower-card\">Saving your flower card</h3>\n<p>“Save flower card” opens a preview with the labelled flower, stem, a short summary and response coverage. You can download a 1080 × 1560 PNG or an SVG with crisp text around an embedded image of the 3D flower. Everything is made in your browser, including in the offline copy. No responses are uploaded.</p>\n<p>The card describes the same answers used in the results. Its heading follows the separate benefit and harm averages:</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Heading</th><th>Answer pattern</th></tr></thead><tbody>\n<tr><td>Promise, with thorns</td><td>Both averages are at least 75.</td></tr>\n<tr><td>Room to bloom</td><td>Benefits are at least 75 and harms are below 50.</td></tr>\n<tr><td>Mind the thorns</td><td>Harms are at least 75 and benefits are below 50.</td></tr>\n<tr><td>Neither story sells it</td><td>Both averages are at most 25.</td></tr>\n<tr><td>The middle has layers</td><td>Both averages are exactly 50.</td></tr>\n<tr><td>More than one shade</td><td>Other combinations with enough answers for both averages.</td></tr>\n<tr><td>Still taking shape</td><td>Too few answers for one or both averages.</td></tr>\n</tbody></table></div>\n<p>The summary may name the issues with the strongest opposing benefit and harm leans. It reports both/and with at least four complete pairs, expected change with all three change answers, and inner conflict only when you answered that reflection. These headings are short descriptions, not validated personality types.</p>\n<p>Example cards are labelled “Example flower”. Cards with incomplete responses are labelled “Flower in progress”. The response count makes clear how much of the questionnaire the portrait covers.</p>\n<h2 id=\"6-examples-of-how-answers-become-results\">6. Examples of how answers become results</h2>\n<p>In this table, B means the benefit answer and H the harm answer. Both use the original 0–4 response values.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>Response pattern</th><th>Result</th></tr></thead><tbody>\n<tr><td>All seven B=4, H=4</td><td>Benefits 100; harms 100; both/and 7 of 7.</td></tr>\n<tr><td>All seven B=2, H=2</td><td>Benefits 50; harms 50; both/and 0 of 7. All answers are neutral.</td></tr>\n<tr><td>All seven B=0, H=0</td><td>Benefits 0; harms 0; both/and 0 of 7. Both sets of statements are rejected.</td></tr>\n<tr><td>All seven B=4, H=0</td><td>Benefits 100; harms 0; both/and 0 of 7.</td></tr>\n<tr><td>Three pairs B=4/H=0 and four pairs B=0/H=4</td><td>Benefits 43; harms 57; both/and 0 of 7. Strong views differ by issue.</td></tr>\n<tr><td>All benefit and harm answers are Not sure / skip</td><td>No benefit, harm or both/and summary. All 14 statements are unscored.</td></tr>\n<tr><td>All B=4, all H skipped</td><td>Benefits 100; no harm or both/and summary.</td></tr>\n<tr><td>Benefit and harm answers stay the same; reported conflict changes from 0 to 4</td><td>The scores and both/and count stay the same. The reported feeling changes.</td></tr>\n<tr><td>Use frequency, regulation or consciousness answers change</td><td>Those individual answers change; benefit, harm, change and both/and scores stay the same.</td></tr>\n</tbody></table></div>\n<h2 id=\"7-research-basis-and-limits\">7. Research basis and limits</h2>\n<p><strong>GAAIS, Schepman &amp; Rodway:</strong> supports distinguishing positive and negative AI attitudes. The original scale has initial validation and a later confirmatory study. This questionnaire uses new topic statements and is not the GAAIS. Its validation does not transfer to our wording or indices.</p>\n<ul>\n<li>Initial study: <a href=\"https://pmc.ncbi.nlm.nih.gov/articles/PMC7231759/\" target=\"_blank\" rel=\"noreferrer\">https://pmc.ncbi.nlm.nih.gov/articles/PMC7231759/</a></li>\n<li>Confirmatory study: <a href=\"https://doi.org/10.1080/10447318.2022.2085400\" target=\"_blank\" rel=\"noreferrer\">https://doi.org/10.1080/10447318.2022.2085400</a></li>\n</ul>\n<p><strong>Evaluative Space Grid, Larsen and colleagues:</strong> supports representing positive and negative evaluations separately. Our matched topic counts are a descriptive summary, not the published grid or a validated implementation of it.</p>\n<ul>\n<li><a href=\"https://doi.org/10.1080/02699930801994054\" target=\"_blank\" rel=\"noreferrer\">https://doi.org/10.1080/02699930801994054</a></li>\n</ul>\n<p><strong>Priester &amp; Petty:</strong> distinguishes positive/negative bases of attitudes from subjective ambivalence. Our reflection items are adapted/original prompts inspired by that work. Their wording, response range and separate reporting need evaluation.</p>\n<ul>\n<li><a href=\"https://richardepetty.com/wp-content/uploads/2019/01/1996-jpsp-priesterpetty.pdf\" target=\"_blank\" rel=\"noreferrer\">https://richardepetty.com/wp-content/uploads/2019/01/1996-jpsp-priesterpetty.pdf</a></li>\n</ul>\n<p><strong>Paradox Mindset Inventory:</strong> addresses a broader disposition towards tensions. It is not used here: agreeing with both sides of a few AI statements is insufficient to infer someone&#x27;s paradox mindset.</p>\n<ul>\n<li><a href=\"https://paradox.lerner.udel.edu/moreinformation.php\" target=\"_blank\" rel=\"noreferrer\">https://paradox.lerner.udel.edu/moreinformation.php</a></li>\n</ul>\n<p>No copied full instrument, psychological diagnosis, population norms, calibrated match probabilities or validated archetypes are included.</p></main><footer class=\"footer\">Nothing is collected on this form</footer></body></html>", "scoring.md": "# AI Flower: scoring and interpretation\n\nAI Flower shows where you see promise, where you see harm, and where you see both. It also asks how much change you expect and how you feel about it.\n\n“Stretch” means agreeing with both the benefit and harm statement about the same issue. You can hold both views without feeling torn. Mixed feelings, inner conflict and difficulty deciding are asked about separately.\n\nThe result describes your answers at this moment. It is not a personality diagnosis.\n\n## Item map\n\n\n| Summary | Items | Interpretation |\n|---|---|---|\n| Benefit expectations | CRE-B, JOB-B, INF-B, MED-B, EDU-B, DIS-B, ENV-B | Average agreement with seven selected benefit expectations |\n| Harm expectations | CRE-H, JOB-H, INF-H, MED-H, EDU-H, DIS-H, ENV-H | Average agreement with seven selected harm expectations |\n| Expected change | CHG-P, CHG-E, CHG-S | Size of expected change in personal activity, education and society |\n| Stretch / both-and | The seven matching B/H topic pairs | How often both expectations are endorsed within the same topic |\n| Experienced ambivalence | FEEL-M, FEEL-C, FEEL-I, shown individually | Mixed reactions, inner conflict and difficulty deciding |\n| Context and principles | All remaining items | Displayed as their own answers; excluded from the headline scores |\n\nConsciousness, corporate trust, use frequency, consent, precaution and regulation do not carry hidden optimism or pessimism points. Questions about existential risk are shown as individual answers because they concern longer-term possibilities, rather than the five-year effects covered by the benefit and harm summaries.\n\n\n## 1. Benefits and harms: what the scores mean\n\nBenefits and harms each have their own score. Agreeing with a harm statement does not reduce your benefit score, or vice versa.\n\nEach answer has a value from 0 to 4. The score is the average of your answered statements, multiplied by 25:\n\n    Score = average answer × 25\n\n| Score | Average response |\n|---|---|\n| 0 | Strongly disagree |\n| 25 | Disagree |\n| 50 | Neither agree nor disagree |\n| 75 | Agree |\n| 100 | Strongly agree |\n\nThese numbers describe agreement with the statements. They are not probabilities, percentages of people or rankings against other respondents.\n\nA score of 50 can come from neutral answers throughout, or from strong agreement on some issues and strong disagreement on others. The answer breakdown shows which is the case.\n\nEach of the seven issues has equal weight. A score appears once at least four of its seven statements have a substantive answer. The number answered is shown alongside it. “Not sure / skip” and unanswered statements are left out; the neutral answer counts as 2. Scores are rounded to the nearest whole number, with halves rounded up.\n\nThe four-answer minimum is a practical coverage rule, not a validated threshold. Scores based on different sets of answered issues may not be directly comparable.\n\n## 2. How much change you expect\n\nThree questions ask how much AI will change your learning, teaching or work; education; and society over the next five years. They ask about the amount of change, whether you welcome it or not.\n\n| Answer | Value on the 0–100 scale |\n|---|---|\n| None | 0 |\n| Small | 25 |\n| Moderate | 50 |\n| Large | 75 |\n| Fundamental | 100 |\n\nThe overall score is the average across all three settings. It appears only when all three questions have substantive answers. Your answers for each setting are also shown, so a small expected change in your own day does not hide a large expected change in society.\n\nAI use frequency and beliefs about artificial general intelligence do not affect this score.\n\n## 3. Where you see both benefit and harm\n\nSeven issues have a matching benefit and harm statement. A topic counts as “both/and” when you answer Agree or Strongly agree to both.\n\n| Your answers within an issue | How it is described |\n|---|---|\n| Agree or strongly agree with both statements | You see both |\n| Agree or strongly agree only with the benefit statement | You see benefit |\n| Agree or strongly agree only with the harm statement | You see harm |\n| Neither statement receives agreement | Neither view is endorsed |\n| Either answer is missing or Not sure / skip | Incomplete pair |\n\n“Neither endorsed” includes neutral and disagreeing answers. It does not mean you are indifferent. Your original ratings remain visible.\n\nThe result gives a count, such as:\n\n> You agreed with both the benefit and harm statement in 5 of 7 comparable topics.\n\nThis count appears once at least four pairs are complete. It includes only topics where both answers are known. Seeing benefit in healthcare and harm in jobs does not count as seeing both within either issue.\n\nThe equivalent percentage is the number of both/and topics divided by the number of complete pairs, multiplied by 100. The count is shown because it makes the coverage clearer. A change from Neutral to Agree can change that count; it does not establish a sudden change in your feelings. This is a description of the chosen answers, not a validated ambivalence scale or a basis for ranking people.\n\n## 4. How it feels to you\n\nThe final three questions ask about mixed feelings, inner conflict and difficulty deciding. Each answer is shown on its own, from Not at all to Very much. Missing answers stay unscored.\n\nThese are different experiences. You may see benefits and harms clearly while feeling settled about your position. You may also feel torn for reasons the seven paired issues do not capture.\n\nOnly your direct answer about inner conflict supports a statement that you feel torn. The both/and count does not supply that answer.\n\n## 5. Reading your flower and card\n\nEach of the seven petals represents one issue: creative work, jobs, information and truth, healthcare, learning and teaching, who benefits, or the environment.\n\n| Feature | What it shows |\n|---|---|\n| Green through yellow to red | Your benefit rating compared with your harm rating. Green leans towards benefit; red towards harm; yellow means equal ratings. |\n| Petal length | How strongly you agree with either statement. Stronger agreement makes a longer petal. |\n| Smooth or jagged texture | Agreement with both statements. Agreeing with both adds texture; strongly agreeing with both adds deeper texture. |\n| Rising or drooping tips | The same benefit–harm balance as the colour: green rises, red droops. |\n| Short, smooth petal | Neither statement received agreement. |\n| Grey petal | One or both answers are missing or Not sure / skip. |\n| Stem | Decoration. It carries no score. |\n\nYellow can mean strong agreement with both statements, neutrality on both, or disagreement with both. Petal length, texture and the answer readout distinguish these cases. Jaggedness shows both/and in your answers; it does not show how distressed or conflicted you feel.\n\n### How the petal is calculated\n\nColour follows the difference between the two original 0–4 ratings: `(benefit − harm) ÷ 4`. Equal ratings produce yellow.\n\nFor length and texture, each rating becomes 0 for Strongly disagree, Disagree or Neutral; 0.5 for Agree; and 1 for Strongly agree. Length follows the larger of these two values. Texture follows the smaller, so it increases only when both statements receive agreement. These values set the drawing, not a new psychological score.\n\nPetal width and the stem are decorative. The rise or droop repeats the colour signal. Turning, zooming and the Visual relief control change your view of the flower, not your answers. Its area, volume and overall colour are not scored.\n\n### Saving your flower card\n\n“Save flower card” opens a preview with the labelled flower, stem, a short summary and response coverage. You can download a 1080 × 1560 PNG or an SVG with crisp text around an embedded image of the 3D flower. Everything is made in your browser, including in the offline copy. No responses are uploaded.\n\nThe card describes the same answers used in the results. Its heading follows the separate benefit and harm averages:\n\n| Heading | Answer pattern |\n|---|---|\n| Promise, with thorns | Both averages are at least 75. |\n| Room to bloom | Benefits are at least 75 and harms are below 50. |\n| Mind the thorns | Harms are at least 75 and benefits are below 50. |\n| Neither story sells it | Both averages are at most 25. |\n| The middle has layers | Both averages are exactly 50. |\n| More than one shade | Other combinations with enough answers for both averages. |\n| Still taking shape | Too few answers for one or both averages. |\n\nThe summary may name the issues with the strongest opposing benefit and harm leans. It reports both/and with at least four complete pairs, expected change with all three change answers, and inner conflict only when you answered that reflection. These headings are short descriptions, not validated personality types.\n\nExample cards are labelled “Example flower”. Cards with incomplete responses are labelled “Flower in progress”. The response count makes clear how much of the questionnaire the portrait covers.\n\n## 6. Examples of how answers become results\n\nIn this table, B means the benefit answer and H the harm answer. Both use the original 0–4 response values.\n\n| Response pattern | Result |\n|---|---|\n| All seven B=4, H=4 | Benefits 100; harms 100; both/and 7 of 7. |\n| All seven B=2, H=2 | Benefits 50; harms 50; both/and 0 of 7. All answers are neutral. |\n| All seven B=0, H=0 | Benefits 0; harms 0; both/and 0 of 7. Both sets of statements are rejected. |\n| All seven B=4, H=0 | Benefits 100; harms 0; both/and 0 of 7. |\n| Three pairs B=4/H=0 and four pairs B=0/H=4 | Benefits 43; harms 57; both/and 0 of 7. Strong views differ by issue. |\n| All benefit and harm answers are Not sure / skip | No benefit, harm or both/and summary. All 14 statements are unscored. |\n| All B=4, all H skipped | Benefits 100; no harm or both/and summary. |\n| Benefit and harm answers stay the same; reported conflict changes from 0 to 4 | The scores and both/and count stay the same. The reported feeling changes. |\n| Use frequency, regulation or consciousness answers change | Those individual answers change; benefit, harm, change and both/and scores stay the same. |\n\n## 7. Research basis and limits\n\n**GAAIS, Schepman & Rodway:** supports distinguishing positive and negative AI attitudes. The original scale has initial validation and a later confirmatory study. This questionnaire uses new topic statements and is not the GAAIS. Its validation does not transfer to our wording or indices.\n\n- Initial study: https://pmc.ncbi.nlm.nih.gov/articles/PMC7231759/\n- Confirmatory study: https://doi.org/10.1080/10447318.2022.2085400\n\n**Evaluative Space Grid, Larsen and colleagues:** supports representing positive and negative evaluations separately. Our matched topic counts are a descriptive summary, not the published grid or a validated implementation of it.\n\n- https://doi.org/10.1080/02699930801994054\n\n**Priester & Petty:** distinguishes positive/negative bases of attitudes from subjective ambivalence. Our reflection items are adapted/original prompts inspired by that work. Their wording, response range and separate reporting need evaluation.\n\n- https://richardepetty.com/wp-content/uploads/2019/01/1996-jpsp-priesterpetty.pdf\n\n**Paradox Mindset Inventory:** addresses a broader disposition towards tensions. It is not used here: agreeing with both sides of a few AI statements is insufficient to infer someone's paradox mindset.\n\n- https://paradox.lerner.udel.edu/moreinformation.php\n\nNo copied full instrument, psychological diagnosis, population norms, calibrated match probabilities or validated archetypes are included.\n"};

(()=>{
